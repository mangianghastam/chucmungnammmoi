    <div class="a">
    <p>May the New Year bring you joy, <br>
        Happiness that won't destroy,<br>
        Good health to keep you strong,<br>
        And peace to carry you along.<br><br>
        
        May success be at your door,<br>
        Every day bring something more,<br>
        And as you journey through the year,<br>
        May your path be crystal clear.</p></div>
